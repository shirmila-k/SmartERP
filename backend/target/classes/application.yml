server:
  port: 8080

spring:
  application:
    name: snack-erp-backend
  datasource:
    url: jdbc:mysql://localhost:3306/snack_erp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: erp_user
    password: erp_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Kolkata
